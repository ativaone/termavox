# TEST-ONLY override for the release smoke (scripts/release-smoke.ts, plan §15.4). Never use it
# for a real install. The smoke always runs it on top of the deployment file, under its own
# project name, so nothing here can touch an install of the same host:
#
#   docker compose -p termavox-smoke -f deploy/compose.yaml -f test/release/compose.smoke.yaml ...
#
# It never renames the images: with it alone the stack runs the images deploy/compose.yaml names
# (`pnpm test:release --prebuilt`, the release pipeline). From source, the smoke adds
# test/release/compose.smoke-images.yaml after it, for the test-only termavox-smoke-* images.
#
# Set by the smoke (required): TERMAVOX_SECRETS_DIR (a temporary directory filled by
# deploy/scripts/init-secrets.sh), TERMAVOX_HTTP_PORT and TERMAVOX_HTTPS_PORT (high ports).
# Optional: TERMAVOX_SMOKE_EDGE_SUBNET (default 172.30.111.0/24) and TERMAVOX_SMOKE_SSHD_IMAGE
# (default termavox-test-sshd:tmux-3.4, built by test/sshd/compose.yaml).

services:
  caddy:
    # Loopback only: the smoke stack is never reachable from the network, even briefly.
    ports: !override
      - "127.0.0.1:${TERMAVOX_HTTP_PORT:?}:${TERMAVOX_HTTP_PORT:?}"
      - "127.0.0.1:${TERMAVOX_HTTPS_PORT:?}:${TERMAVOX_HTTPS_PORT:?}"

  session-manager:
    environment:
      # Follows the edge subnet below (the deployment file derives both from one anchor).
      TERMAVOX_TRUSTED_PROXIES: ${TERMAVOX_SMOKE_EDGE_SUBNET:-172.30.111.0/24}

  # The SSH target: an already-built test sshd image (test-only keys, see test/sshd/keys) on the
  # edge network, where session-manager reaches it by name at a private address the SSH target
  # policy allows. Never built or pulled here.
  smoke-sshd:
    image: ${TERMAVOX_SMOKE_SSHD_IMAGE:-termavox-test-sshd:tmux-3.4}
    pull_policy: never
    init: true
    hostname: tv-smoke-sshd
    mem_limit: 128m
    pids_limit: 256
    networks:
      - edge

networks:
  # Not the deployment's fixed 172.30.10.0/24: a real install on this host keeps its subnet.
  edge:
    ipam:
      config: !override
        - subnet: ${TERMAVOX_SMOKE_EDGE_SUBNET:-172.30.111.0/24}

# The temporary secrets of this run instead of deploy/secrets.
secrets:
  master_key:
    file: ${TERMAVOX_SECRETS_DIR:?}/master_key
  internal_token:
    file: ${TERMAVOX_SECRETS_DIR:?}/internal_token
  ws_secret:
    file: ${TERMAVOX_SECRETS_DIR:?}/ws_secret
  auth_secret:
    file: ${TERMAVOX_SECRETS_DIR:?}/auth_secret
